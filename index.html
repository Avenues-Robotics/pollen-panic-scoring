<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pollen Panic Scorer</title>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; }
  button, input { font-family: inherit; }
  .app-shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px minmax(0, 1fr);
    min-height: 100vh;
  }
  .middle-panel {
    width: 300px;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    background: #f0f0f0;
    border-left: 0.5px solid #ddd;
    border-right: 0.5px solid #ddd;
  }
  .room-control {
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    border: 0.5px solid #c8c8c8;
    background: white;
  }
  .room-control label {
    display: block;
    margin-bottom: 5px;
    color: #333;
    font-size: 11px;
    font-weight: 600;
  }
  .room-form {
    display: flex;
    gap: 5px;
  }
  .room-form input {
    width: 0;
    min-width: 0;
    flex: 1;
    padding: 7px 6px;
    border: 1px solid #999;
    border-radius: 7px;
    color: #111;
    font-size: 13px;
  }
  .room-form button {
    padding: 7px 8px;
    border-radius: 7px;
    border: 1.5px solid #2a5d82;
    background: #2a5d82;
    color: white;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .room-active {
    min-height: 15px;
    margin-top: 6px;
    color: #555;
    font-size: 11px;
    text-align: center;
    overflow-wrap: anywhere;
  }
  @media (max-width: 760px) {
    .app-shell {
      grid-template-columns: 1fr;
    }
    .middle-panel {
      order: -1;
      width: 100% !important;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0.75rem !important;
    }
    .middle-panel > * {
      width: 140px !important;
    }
    .middle-panel .room-control {
      width: min(100%, 280px) !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HIVE_MAX = [3, 2, 3];
const ROOM_STORAGE_KEY = "pollen-panic-room";
const MATCH_SEGMENTS = {
  auto: { label: "Start Auto", seconds: 30 },
  transition: { label: "Countdown", seconds: 10 },
  tele: { label: "TeleOp", seconds: 120 },
  done: { label: "Match Complete", seconds: 0 },
};

const defaultTeam = () => ({
  hives: [0, 0, 0],
  phase: "pre",
  autoFinalized: false,
  auto: { pollen: 0, hiveBonus: 0, clearBonus: 0 },
  tele: { pollen: 0, hiveBonus: 0, clearBonus: 0 },
  penalties: 0,
});

const defaultTimer = () => ({ segment: "idle", startedAt: null });
const defaultState = () => ({ red: defaultTeam(), blue: defaultTeam(), history: [], timer: defaultTimer() });

function normalizeRoom(value) {
  return String(value || "").trim().replace(/\s+/g, "-").slice(0, 32);
}

function getInitialRoom() {
  try {
    const fromUrl = new URLSearchParams(location.search).get("room");
    return normalizeRoom(fromUrl || localStorage.getItem(ROOM_STORAGE_KEY) || "");
  } catch {
    return "";
  }
}

function liveHiveStats(team) {
  let pollen = 0, hiveBonus = 0;
  team.hives.forEach((h, i) => { pollen += h; if (h >= HIVE_MAX[i]) hiveBonus += 5; });
  return { pollen, hiveBonus };
}

function calcScore(team) {
  const live = liveHiveStats(team);
  const liveCounts = team.phase === "tele" || team.phase === "end" || (team.phase === "auto" && !team.autoFinalized);
  return (
    team.auto.pollen + team.auto.hiveBonus + team.auto.clearBonus +
    team.tele.pollen + team.tele.hiveBonus + team.tele.clearBonus +
    (liveCounts ? live.pollen + live.hiveBonus : 0) + team.penalties
  );
}

function currentPeriod(team) {
  return team.phase === "tele" || team.phase === "end" ? "tele" : "auto";
}

const PHASE_LABELS = { pre: "Pre-game", auto: "Autonomous", tele: "TeleOp", end: "Final" };

function formatTime(seconds) {
  const safeSeconds = Math.max(0, Math.ceil(seconds));
  const minutes = Math.floor(safeSeconds / 60);
  const remainder = safeSeconds % 60;
  return `${minutes}:${String(remainder).padStart(2, "0")}`;
}

function PhaseBadge({ phase, style = {} }) {
  const colors = { pre: { bg: "#eee", color: "#555" }, auto: { bg: "#d4edda", color: "#155724" }, tele: { bg: "#d0e4ff", color: "#0a2e6e" }, end: { bg: "#e2e2e2", color: "#222" } };
  const c = colors[phase] || colors.pre;
  return <div style={{ fontSize: 11, fontWeight: 500, textAlign: "center", padding: "4px 8px", borderRadius: 6, background: c.bg, color: c.color, ...style }}>{PHASE_LABELS[phase]}</div>;
}

function MatchTimer({ timer }) {
  const segment = timer?.segment || "idle";
  const segmentConfig = MATCH_SEGMENTS[segment];
  const isRunning = Boolean(segmentConfig && timer?.startedAt);
  const elapsed = isRunning ? (Date.now() - timer.startedAt) / 1000 : 0;
  const remaining = segmentConfig ? segmentConfig.seconds - elapsed : 0;
  const finalCountdownSecond = segment === "transition" && isRunning && remaining > 0 && remaining <= 3 ? Math.ceil(remaining) : null;
  const isFinalFlash = Boolean(finalCountdownSecond && (remaining % 1) > 0.65);
  const label = finalCountdownSecond ? `TeleOp in ${finalCountdownSecond}` : segmentConfig ? segmentConfig.label : "Timer";
  const displayTime = segment === "done" ? "0:00" : isRunning ? formatTime(remaining) : "0:30";
  const bg = isFinalFlash ? "#b00020" : segment === "tele" ? "#eaf1ff" : segment === "transition" ? "#fff7df" : segment === "done" ? "#eee" : "#eef8ee";
  const color = isFinalFlash ? "white" : segment === "tele" ? "#0a2e6e" : segment === "transition" ? "#6b4b00" : segment === "done" ? "#333" : "#155724";
  const border = isFinalFlash ? "2px solid #7a0016" : "0.5px solid rgba(0,0,0,0.12)";

  return (
    <div style={{ width: "100%", padding: 10, borderRadius: 10, background: bg, color, border, textAlign: "center" }}>
      <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: 0.4, fontWeight: 700 }}>{label}</div>
      <div style={{ fontSize: 56, lineHeight: 1.05, fontVariantNumeric: "tabular-nums", fontWeight: 700 }}>{displayTime}</div>
    </div>
  );
}

function Ball({ filled }) {
  return <div style={{ width: 28, height: 28, borderRadius: "50%", flexShrink: 0, background: filled ? "radial-gradient(circle at 35% 35%, #ffe566, #c8900a)" : "#e0e0e0", border: filled ? "none" : "1.5px dashed #aaa", transition: "all 0.2s" }} />;
}

function Hive({ count, max, isFull, teamColor, onAdd, onRemove }) {
  const borderColor = isFull ? teamColor : "#bbb";
  const bg = isFull ? (teamColor === "#b02020" ? "#fff5f5" : "#f5f7ff") : "white";
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6, flex: 1 }}>
      <div onClick={onAdd} style={{ display: "flex", flexDirection: "column-reverse", gap: 4, alignItems: "center", cursor: "pointer", padding: "8px 6px", borderRadius: 10, border: `2px solid ${borderColor}`, background: bg, width: "100%", minHeight: 60, justifyContent: "flex-start", transition: "border-color 0.15s" }}>
        {Array.from({ length: max }, (_, s) => <Ball key={s} filled={s < count} />)}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
        <span style={{ fontSize: 11, color: "#333" }}>H{HIVE_MAX.indexOf(max) + 1}</span>
        <button onClick={(e) => { e.stopPropagation(); onRemove(); }} style={{ width: 20, height: 20, borderRadius: "50%", border: "1.5px solid #666", background: "white", fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", color: "#333", padding: 0, lineHeight: 1 }}>−</button>
      </div>
    </div>
  );
}

function ScoreTable({ autoStats, teleStats, livePollen, liveHiveBonus, phase, autoFinalized }) {
  const lp = phase === "tele" || phase === "end" ? "tele" : phase === "auto" && !autoFinalized ? "auto" : "none";
  const ap = autoStats.pollen + (lp === "auto" ? livePollen : 0);
  const ah = autoStats.hiveBonus + (lp === "auto" ? liveHiveBonus : 0);
  const tp = teleStats.pollen + (lp === "tele" ? livePollen : 0);
  const th = teleStats.hiveBonus + (lp === "tele" ? liveHiveBonus : 0);
  const thStyle = { fontSize: 10, textTransform: "uppercase", letterSpacing: 0, color: "#555", fontWeight: 500, textAlign: "right", padding: "4px 4px 2px" };
  const tdStyle = { fontSize: 12, padding: "2px 4px", color: "#111", textAlign: "right" };
  const tdLabel = { fontSize: 12, padding: "2px 4px", color: "#444", textAlign: "left" };
  return (
    <table style={{ width: "100%", borderCollapse: "collapse", marginTop: 8, borderTop: "0.5px solid rgba(0,0,0,0.12)" }}>
      <thead><tr><th style={{ ...thStyle, textAlign: "left" }}></th><th style={thStyle}>Auto</th><th style={thStyle}>Tele</th></tr></thead>
      <tbody>
        <tr><td style={tdLabel}>Pollen scored</td><td style={tdStyle}>{ap}</td><td style={tdStyle}>{tp}</td></tr>
        <tr><td style={tdLabel}>Hive bonus</td><td style={tdStyle}>{ah}</td><td style={tdStyle}>{th}</td></tr>
        <tr><td style={tdLabel}>Clear bonus</td><td style={tdStyle}>{autoStats.clearBonus}</td><td style={tdStyle}>{teleStats.clearBonus}</td></tr>
      </tbody>
    </table>
  );
}

function TeamPanel({ teamId, teamData, score, onAddToHive, onRemoveFromHive, onClearHives, onPenalty, onFinalizeAuto, flashMsg, flashLog }) {
  const isRed = teamId === "red";
  const teamColor = isRed ? "#b02020" : "#1a3db0";
  const clearColor = isRed ? "#8a1515" : "#0e2e8a";
  const panelBg = isRed ? "#fff0f0" : "#f0f4ff";
  const live = liveHiveStats(teamData);
  const btnStyle = (danger = false) => ({ display: "block", width: "100%", marginTop: 4, padding: "7px 8px", borderRadius: 8, border: `1.5px solid ${danger ? "#a00" : "#333"}`, background: "white", color: danger ? "#a00" : "#111", fontSize: 11, cursor: "pointer", textAlign: "center", fontFamily: "inherit" });
  return (
    <div style={{ padding: "1.5rem 1rem", display: "flex", flexDirection: "column", gap: "1rem", background: panelBg, borderRight: isRed ? "1px solid #e0b0b0" : "none", borderLeft: isRed ? "none" : "1px solid #b0c0e0" }}>
      <div style={{ fontSize: 18, fontWeight: 500, textAlign: "center", color: teamColor }}>{isRed ? "🔴 RED" : "🔵 BLUE"}</div>
      <div style={{ fontSize: 64, fontWeight: 500, textAlign: "center", lineHeight: 1, color: teamColor }}>{score}</div>
      <PhaseBadge phase={teamData.phase} />
      <div style={{ background: "rgba(255,255,255,0.7)", borderRadius: 10, padding: 10, border: "0.5px solid rgba(0,0,0,0.12)" }}>
        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0, color: "#333", marginBottom: 6 }}>Hives — tap to add pollen</div>
        <div style={{ display: "flex", gap: 10, justifyContent: "space-around", alignItems: "flex-end" }}>
          {[0, 1, 2].map(i => <Hive key={i} count={teamData.hives[i]} max={HIVE_MAX[i]} isFull={teamData.hives[i] >= HIVE_MAX[i]} teamColor={teamColor} onAdd={() => onAddToHive(i)} onRemove={() => onRemoveFromHive(i)} />)}
        </div>
        <div style={{ fontSize: 11, color: "#333", textAlign: "center", minHeight: 16, marginTop: 4 }}>{flashMsg}</div>
        <button onClick={onClearHives} style={{ width: "100%", padding: 9, borderRadius: 8, border: `2px solid ${clearColor}`, fontSize: 12, fontWeight: 500, cursor: "pointer", marginTop: 6, background: "white", color: clearColor, fontFamily: "inherit" }}>
          CLEAR HIVES (+10 if all full)
        </button>
        <ScoreTable autoStats={teamData.auto} teleStats={teamData.tele} livePollen={live.pollen} liveHiveBonus={live.hiveBonus} phase={teamData.phase} autoFinalized={teamData.autoFinalized} />
      </div>
      <div style={{ background: "rgba(255,255,255,0.7)", borderRadius: 10, padding: 10, border: "0.5px solid rgba(0,0,0,0.12)" }}>
        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0, color: "#333", marginBottom: 6 }}>Penalties against {teamId}</div>
        <button onClick={() => onPenalty("cross")}   style={btnStyle()}>AUTO: Crossed midline + contact (−10)</button>
        <button onClick={() => onPenalty("hivehit")} style={btnStyle()}>Contacted opponent's hive (−3)</button>
        <button onClick={() => onPenalty("descore")} style={btnStyle()}>De-scored opponent pollen (−2)</button>
        <button onClick={() => onPenalty("gate")}    style={btnStyle(true)}>Activated opponent's hive gate (−10)</button>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 500, borderTop: "0.5px solid rgba(0,0,0,0.12)", marginTop: 4, paddingTop: 4 }}>
          <span style={{ color: "#444" }}>Total penalties</span>
          <span style={{ color: "#a00" }}>{teamData.penalties}</span>
        </div>
      </div>
      {teamData.phase === "auto" && (
        <button onClick={onFinalizeAuto} style={{ width: "100%", padding: 11, borderRadius: 8, border: `2px solid ${clearColor}`, background: clearColor, color: "white", fontSize: 13, fontWeight: 500, cursor: "pointer", fontFamily: "inherit" }}>
          Finalize Autonomous Score
        </button>
      )}
      <div style={{ fontSize: 11, color: "#333", textAlign: "center", minHeight: 16 }}>{flashLog}</div>
    </div>
  );
}

function App() {
  const [state, setState] = useState(defaultState);
  const [roomInput, setRoomInput] = useState(getInitialRoom);
  const [activeRoom, setActiveRoom] = useState("");
  const stateRef = useRef(state);
  const wsRef = useRef(null);
  const activeRoomRef = useRef("");
  const requestedRoomRef = useRef(roomInput);
  const [flashRed, setFlashRed] = useState("");
  const [flashBlue, setFlashBlue] = useState("");
  const [flashRedLog, setFlashRedLog] = useState("");
  const [flashBlueLog, setFlashBlueLog] = useState("");
  const [syncStatus, setSyncStatus] = useState("connecting...");
  const [timerTick, setTimerTick] = useState(0);
  const flashTimeout = useRef({});
  const buzzerRef = useRef({ auto: false, transitionSecond: null, teleStart: false, final: false });
  const audioContextRef = useRef(null);

  // WebSocket setup
  useEffect(() => {
    const WS_URL = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;
    let ws;
    let reconnectTimer;

    const sendJoin = (room) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "join", room }));
      }
    };

    function connect() {
      ws = new WebSocket(WS_URL);
      wsRef.current = ws;

      ws.onopen = () => {
        const room = requestedRoomRef.current;
        if (room) {
          setSyncStatus(`joining room ${room}...`);
          sendJoin(room);
        } else {
          setSyncStatus("enter a room");
        }
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === "room-state" && msg.room === requestedRoomRef.current) {
            const incoming = msg.payload || defaultState();
            activeRoomRef.current = msg.room;
            setActiveRoom(msg.room);
            setState(incoming);
            stateRef.current = incoming;
            setSyncStatus(`live in room ${msg.room}`);
          }
          if (msg.type === "state" && msg.room === activeRoomRef.current) {
            const incoming = msg.payload;
            setState(incoming);
            stateRef.current = incoming;
          }
          if (msg.type === "left") {
            setSyncStatus("enter a room");
          }
          if (msg.type === "error") {
            setSyncStatus(msg.message || "sync error");
          }
        } catch {}
      };

      ws.onclose = () => {
        setSyncStatus("disconnected - reconnecting...");
        reconnectTimer = setTimeout(connect, 1500);
      };

      ws.onerror = () => ws.close();
    }

    connect();
    return () => { clearTimeout(reconnectTimer); ws?.close(); };
  }, []);

  const broadcast = useCallback((s) => {
    const ws = wsRef.current;
    const room = activeRoomRef.current;
    if (room && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "state", room, payload: s }));
    }
  }, []);

  const joinRoom = useCallback((rawRoom = roomInput) => {
    const room = normalizeRoom(rawRoom);
    requestedRoomRef.current = room;
    setRoomInput(room);

    try {
      const url = new URL(location.href);
      if (room) url.searchParams.set("room", room);
      else url.searchParams.delete("room");
      history.replaceState(null, "", url);
      if (room) localStorage.setItem(ROOM_STORAGE_KEY, room);
      else localStorage.removeItem(ROOM_STORAGE_KEY);
    } catch {}

    if (!room) {
      const fresh = defaultState();
      activeRoomRef.current = "";
      setActiveRoom("");
      setState(fresh);
      stateRef.current = fresh;
      setSyncStatus("enter a room");
      if (wsRef.current?.readyState === WebSocket.OPEN) {
        wsRef.current.send(JSON.stringify({ type: "leave" }));
      }
      return;
    }

    setSyncStatus(`joining room ${room}...`);
    if (wsRef.current?.readyState === WebSocket.OPEN) {
      wsRef.current.send(JSON.stringify({ type: "join", room }));
    }
  }, [roomInput]);

  const flash = useCallback((team, msg, ms = 2500) => {
    const setter = team === "red" ? setFlashRed : setFlashBlue;
    setter(msg);
    clearTimeout(flashTimeout.current[team]);
    flashTimeout.current[team] = setTimeout(() => setter(""), ms);
  }, []);

  const flashLog = useCallback((team, msg, ms = 2500) => {
    const setter = team === "red" ? setFlashRedLog : setFlashBlueLog;
    setter(msg);
    clearTimeout(flashTimeout.current[team + "log"]);
    flashTimeout.current[team + "log"] = setTimeout(() => setter(""), ms);
  }, []);

  const snapshot = (s) => {
    const hist = [...(s.history || [])];
    hist.push(JSON.stringify({ red: JSON.parse(JSON.stringify(s.red)), blue: JSON.parse(JSON.stringify(s.blue)), timer: JSON.parse(JSON.stringify(s.timer || defaultTimer())) }));
    if (hist.length > 30) hist.shift();
    return hist;
  };

  const update = (fn) => {
    setState(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      next.history = snapshot(prev);
      next.timer = next.timer || defaultTimer();
      fn(next);
      stateRef.current = next;
      broadcast(next);
      return next;
    });
  };

  const updateSystem = useCallback((fn) => {
    setState(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      next.timer = next.timer || defaultTimer();
      fn(next);
      stateRef.current = next;
      broadcast(next);
      return next;
    });
  }, [broadcast]);

  const playBuzzer = useCallback((count = 3) => {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const audio = audioContextRef.current || new AudioContext();
    audioContextRef.current = audio;
    const gain = audio.createGain();
    gain.gain.setValueAtTime(0.18, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + (count * 0.25) + 0.3);
    gain.connect(audio.destination);
    Array.from({ length: count }, (_, i) => i * 0.25).forEach(offset => {
      const oscillator = audio.createOscillator();
      oscillator.type = "square";
      oscillator.frequency.setValueAtTime(440, audio.currentTime + offset);
      oscillator.connect(gain);
      oscillator.start(audio.currentTime + offset);
      oscillator.stop(audio.currentTime + offset + 0.18);
    });
  }, []);

  useEffect(() => {
    const interval = setInterval(() => setTimerTick(t => t + 1), 250);
    return () => clearInterval(interval);
  }, []);

  useEffect(() => {
    const timer = state.timer || defaultTimer();
    if (!timer.startedAt || !MATCH_SEGMENTS[timer.segment]) return;
    const elapsed = (Date.now() - timer.startedAt) / 1000;

    if (timer.segment === "auto" && elapsed >= MATCH_SEGMENTS.auto.seconds && !buzzerRef.current.auto) {
      buzzerRef.current.auto = true;
      buzzerRef.current.transitionSecond = null;
      playBuzzer(3);
      updateSystem(s => {
        s.timer = { segment: "transition", startedAt: Date.now() };
      });
    }

    if (timer.segment === "transition") {
      const remaining = MATCH_SEGMENTS.transition.seconds - elapsed;
      const countdownSecond = remaining > 0 && remaining <= 3 ? Math.ceil(remaining) : null;
      if (countdownSecond && buzzerRef.current.transitionSecond !== countdownSecond) {
        buzzerRef.current.transitionSecond = countdownSecond;
        playBuzzer(1);
      }
    }

    if (timer.segment === "transition" && elapsed >= MATCH_SEGMENTS.transition.seconds && !buzzerRef.current.teleStart) {
      buzzerRef.current.teleStart = true;
      playBuzzer(1);
      updateSystem(s => {
        if (s.red.phase === "auto") bankHives(s, "red", "auto", { clear: false, finalize: true });
        if (s.blue.phase === "auto") bankHives(s, "blue", "auto", { clear: false, finalize: true });
        s.red.phase = "tele";
        s.blue.phase = "tele";
        s.timer = { segment: "tele", startedAt: Date.now() };
      });
    }

    if (timer.segment === "tele" && elapsed >= MATCH_SEGMENTS.tele.seconds && !buzzerRef.current.final) {
      buzzerRef.current.final = true;
      playBuzzer(3);
      updateSystem(s => {
        bankHives(s, "red", "tele");
        bankHives(s, "blue", "tele");
        s.red.phase = "end";
        s.blue.phase = "end";
        s.timer = { segment: "done", startedAt: Date.now() };
      });
    }
  }, [state.timer, timerTick, playBuzzer, updateSystem]);

  const addToHive = (team, i) => {
    const t = stateRef.current[team];
    if (t.phase === "pre" || t.phase === "end") return;
    if (t.hives[i] >= HIVE_MAX[i]) { flash(team, `H${i + 1} is full!`); return; }
    update(s => {
      s[team].hives[i]++;
      if (s[team].hives[i] === HIVE_MAX[i]) flash(team, `🌟 H${i + 1} full! +5 at period end.`);
    });
  };

  const removeFromHive = (team, i) => {
    const t = stateRef.current[team];
    if (t.hives[i] <= 0 || t.phase === "pre" || t.phase === "end") return;
    update(s => { s[team].hives[i]--; });
  };

  const bankHives = (s, team, period, options = {}) => {
    if (period === "auto" && options.finalize && s[team].autoFinalized) return;
    s[team].hives.forEach((h, i) => {
      s[team][period].pollen += h;
      if (h >= HIVE_MAX[i]) s[team][period].hiveBonus += 5;
    });
    if (period === "auto" && options.finalize) s[team].autoFinalized = true;
    if (options.clear !== false) s[team].hives = [0, 0, 0];
  };

  const clearHives = (team) => {
    const t = stateRef.current[team];
    if (t.phase === "pre" || t.phase === "end") return;
    update(s => {
      const period = currentPeriod(s[team]);
      const allFull = s[team].hives.every((h, i) => h >= HIVE_MAX[i]);
      bankHives(s, team, period);
      if (allFull) { s[team][period].clearBonus += 10; flash(team, "+10 pts — all 3 hives cleared!", 3500); }
      else flash(team, "Hives cleared.");
    });
  };

  const addPenalty = (team, type) => {
    if (stateRef.current[team].phase === "pre") return;
    const amounts = { cross: -10, hivehit: -3, descore: -2, gate: -10 };
    const labels  = { cross: "−10 (midline)", hivehit: "−3 (hive contact)", descore: "−2 (de-scored)", gate: "−10 (hive gate)" };
    update(s => { s[team].penalties += amounts[type]; });
    flashLog(team, labels[type]);
  };

  const newGame = () => {
    buzzerRef.current = { auto: false, transitionSecond: null, teleStart: false, final: false };
    update(s => {
      s.red  = defaultTeam(); s.red.phase  = "auto";
      s.blue = defaultTeam(); s.blue.phase = "auto";
      s.timer = defaultTimer();
    });
  };

  const startTimer = () => {
    const timer = stateRef.current.timer || defaultTimer();
    if (timer.startedAt && timer.segment !== "done") return;
    buzzerRef.current = { auto: false, transitionSecond: null, teleStart: false, final: false };
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext && !audioContextRef.current) audioContextRef.current = new AudioContext();
    audioContextRef.current?.resume?.();
    update(s => {
      s.timer = { segment: "auto", startedAt: Date.now() };
    });
  };

  const finalizeAuto = (team) => {
    if (stateRef.current[team].phase !== "auto") return;
    update(s => {
      bankHives(s, team, "auto", { clear: false, finalize: true });
      s[team].phase = "pre";
    });
  };

  const undoLast = () => {
    if (!stateRef.current.history?.length) return;
    setState(prev => {
      const hist = [...prev.history];
      const prevSnap = JSON.parse(hist.pop());
      const next = { ...prevSnap, history: hist };
      stateRef.current = next;
      broadcast(next);
      return next;
    });
  };

  const redScore  = calcScore(state.red);
  const blueScore = calcScore(state.blue);

  return (
    <div className="app-shell">
      <TeamPanel teamId="red"  teamData={state.red}  score={redScore}  onAddToHive={i => addToHive("red", i)}  onRemoveFromHive={i => removeFromHive("red", i)}  onClearHives={() => clearHives("red")}  onPenalty={t => addPenalty("red", t)}  onFinalizeAuto={() => finalizeAuto("red")} flashMsg={flashRed}  flashLog={flashRedLog} />

      <div className="middle-panel">
        <div className="room-control">
          <label htmlFor="room-number">Room</label>
          <form className="room-form" onSubmit={(e) => { e.preventDefault(); joinRoom(); }}>
            <input id="room-number" value={roomInput} onChange={(e) => setRoomInput(e.target.value)} placeholder="101" inputMode="numeric" autoComplete="off" />
            <button type="submit">Join</button>
          </form>
          <div className="room-active">{activeRoom ? `Room ${activeRoom}` : "No room"}</div>
        </div>
        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0, color: "#333", textAlign: "center" }}>Game</div>
        <button onClick={newGame} style={{ padding: "8px 12px", borderRadius: 8, border: "2px solid #2a7a2a", background: "#2a7a2a", fontSize: 12, fontWeight: 500, cursor: "pointer", width: "100%", color: "white", fontFamily: "inherit" }}>▶ New Game</button>
        <button onClick={startTimer} style={{ padding: "8px 12px", borderRadius: 8, border: "2px solid #2a5d82", background: "#2a5d82", fontSize: 12, fontWeight: 500, cursor: "pointer", width: "100%", color: "white", fontFamily: "inherit" }}>⏱ Start Timer</button>
        <MatchTimer timer={state.timer || defaultTimer()} />
        <div style={{ width: "100%", height: "0.5px", background: "#ccc" }} />
        <button onClick={undoLast} style={{ fontSize: 11, color: "#333", background: "none", border: "none", cursor: "pointer", textDecoration: "underline", width: "100%", fontFamily: "inherit" }}>↩ undo</button>
        <div style={{ fontSize: 11, color: "#555", textAlign: "center" }}>{syncStatus}</div>
      </div>

      <TeamPanel teamId="blue" teamData={state.blue} score={blueScore} onAddToHive={i => addToHive("blue", i)} onRemoveFromHive={i => removeFromHive("blue", i)} onClearHives={() => clearHives("blue")} onPenalty={t => addPenalty("blue", t)} onFinalizeAuto={() => finalizeAuto("blue")} flashMsg={flashBlue} flashLog={flashBlueLog} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
